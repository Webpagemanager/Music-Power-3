[package]
name = "music_power_3"
version = "3.0.0"
edition = "2024"

[dependencies]
windows-reactor = "0.100.0"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Playback",
    "Media_Core",
    "Media_Control",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
] }
memmap2 = "0.9.5"
rayon = "1.10.0"
rkyv = { version = "0.8.9", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memchr = "2.7.4"
image = { version = "0.25.5", default-features = false, features = ["png", "jpeg"] }
crossbeam-channel = "0.5.14"

[build-dependencies]
winres = "0.1.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
